name: hermes-trove
version: 1.2.0
description: Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message
author: Voltropy / Hermes Community
provides_tools:
  - trove_grep
  - trove_recall
  - trove_query_state
  - trove_compute
  - trove_compile_evidence
  - trove_evidence_pack
  - trove_retrieve
  - trove_recent
  - trove_load_session
  - trove_describe
  - trove_expand
  - trove_expand_query
  - trove_status
  - trove_inspect
  - trove_doctor
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - subagent_start
  - subagent_stop
