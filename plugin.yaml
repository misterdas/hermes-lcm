name: hermes-trove
version: 1.2.0
description: Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message
author: Voltropy / Hermes Community
provides_tools:
  - trove_grep
  - trove_recall
  - trove_query_state
  - trove_compute
  - trove_compile_evidence
  - trove_evidence_pack
  - trove_retrieve
  - trove_recent
  - trove_load_session
  - trove_describe
  - trove_expand
  - trove_expand_query
  - trove_status
  - trove_inspect
  - trove_doctor
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - subagent_start
  - subagent_stop
# TROVE manages its own interpreter/venv (sidecar pattern, installed via
# scripts/install.sh). Its pyproject.toml is tooling-only (no [project] table),
# so Hermes PM must not copy it into the lock workspace or `uv lock` fails.
python_runtime: external
